<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>章节测验 · 兄弟 iframe 确认框演示</title>
<style>
  body { margin: 0; font: 15px/1.7 -apple-system, "Segoe UI", sans-serif; background: #eef2f7; color: #1f2937; }
  .page { max-width: 980px; margin: 0 auto; padding: 28px 20px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.sub { margin: 0 0 18px; color: #64748b; font-size: 13px; }
  .frames { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  iframe { width: 100%; height: 420px; border: 1px solid #d7dee8; border-radius: 10px; background: #fff; }
</style>
</head>
<body>
<div class="page">
  <h1>章节测验 · 兄弟 iframe 确认框演示</h1>
  <p class="sub">题目在左边 iframe，提交后“确认提交?”由右边的兄弟 iframe 弹出——扩展必须能把交卷消息转给兄弟页面，才能点掉它。</p>
  <div class="frames">
    <iframe id="quiz"></iframe>
    <iframe id="layer" src="demo-confirm-frame.html"></iframe>
  </div>
</div>
<script>
  window.__confirmed = 0;
  window.__layerShown = 0;

  (function () {
    var qs = new URLSearchParams(location.search);
    var ai = qs.get('vanqaAi') || '';
    var url = 'demo-textquiz.html?parentConfirm=1&vanqa=1&vanqaSubmit=1';
    if (ai) url += '&vanqaAi=' + encodeURIComponent(ai);
    document.getElementById('quiz').src = url;
  })();

  function layerWin() {
    return document.getElementById('layer').contentWindow;
  }

  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'van-demo-submit') {
      // 真实平台里是页面自己去弹框，这里由外层转告“弹框 iframe”
      window.__layerShown++;
      try { layerWin().postMessage({ type: 'van-demo-show-confirm' }, '*'); } catch (e) { /* ignore */ }
      return;
    }
    if (d.type === 'van-demo-layer-ok') {
      window.__confirmed++;
      try {
        document.getElementById('quiz').contentWindow.postMessage({ type: 'van-demo-confirmed' }, '*');
      } catch (e) { /* ignore */ }
    }
  });
</script>
</body>
</html>
