<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>确认框（兄弟 frame）</title>
<style>
  body { margin: 0; font: 14px/1.6 -apple-system, "Segoe UI", sans-serif; background: #eef2f7; color: #1f2937; }
  .note { padding: 10px 14px; color: #64748b; font-size: 12px; }
  .layui-layer { position: fixed; inset: 0; display: none; background: rgba(15, 23, 42, .45); }
  .layui-layer.show { display: block; }
  .box { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 300px; background: #fff; border-radius: 8px; box-shadow: 0 12px 32px rgba(15, 23, 42, .25); }
  .hd { padding: 14px 18px 6px; font-weight: 600; }
  .bd { padding: 0 18px 14px; color: #334155; }
  .ft { padding: 10px 18px 16px; text-align: right; }
  .ft button { min-width: 76px; height: 32px; margin-left: 8px; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; }
  .ft button.primary { border-color: #4f6ef7; background: #4f6ef7; color: #fff; }
</style>
</head>
<body>
  <div class="note">这个 iframe 只负责弹“确认提交?”框，里面没有题目。</div>
  <div class="layui-layer" id="layer">
    <div class="box">
      <div class="hd">提示</div>
      <div class="bd">确认提交?</div>
      <div class="ft">
        <button id="no">取消</button>
        <button id="yes" class="primary">提交</button>
      </div>
    </div>
  </div>
<script>
  window.__shown = 0;
  window.__clicked = 0;

  function show() {
    if (window.__shown) return;
    window.__shown++;
    document.getElementById('layer').classList.add('show');
  }

  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (d && d.type === 'van-demo-show-confirm') show();
  });

  document.getElementById('yes').addEventListener('click', function () {
    window.__clicked++;
    document.getElementById('layer').classList.remove('show');
    try { parent.postMessage({ type: 'van-demo-layer-ok' }, '*'); } catch (e) { /* ignore */ }
  });
  document.getElementById('no').addEventListener('click', function () {
    document.getElementById('layer').classList.remove('show');
  });
</script>
</body>
</html>
