<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>切到下一节后自动播放（跨域 iframe）· 演示页</title>
<style>
  body { margin: 0; font: 15px/1.7 -apple-system, "Segoe UI", sans-serif; background: #eef2f7; color: #1f2937; }
  .page { max-width: 860px; margin: 0 auto; padding: 28px 20px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.sub { margin: 0 0 18px; color: #64748b; font-size: 13px; }
  .player { background: #0b1020; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; }
  iframe { width: 100%; height: 100%; border: 0; }
  .bar { margin-top: 14px; display: flex; align-items: center; gap: 12px; }
  span { color: #64748b; }
</style>
</head>
<body>
<div class="page">
  <h1>切到下一节后自动播放（跨域 iframe）</h1>
  <p class="sub">播放器放在跨域 iframe 里（127.0.0.1 页面嵌 localhost 播放器），外层读不到它的 DOM。
    扩展必须让播放器那一层自己按播放，外层的“下一节”点完后视频才会动。</p>
  <div class="player"><iframe id="frame" title="播放器" allow="autoplay"></iframe></div>
  <div class="bar"><span id="state">等待播放</span></div>
</div>
<script>
  (function () {
    var frame = document.getElementById('frame');
    var state = document.getElementById('state');
    var host = location.hostname === '127.0.0.1' ? 'localhost' : '127.0.0.1';
    // 同机不同 host：跨域，但指向的还是同一个测试服务器
    frame.src = location.protocol + '//' + host + ':' + location.port + '/player.html?lesson=1&autoplay=0&dur=12';
    window.__playing = false;
    window.__childLoaded = false;
    window.__childStatus = '';
    frame.addEventListener('load', function () { window.__childLoaded = true; });
    window.__msgs = [];
    window.addEventListener('message', function (e) {
      var d = e.data || {};
      if (window.__msgs.length < 40) window.__msgs.push(String(d.type || '?') + ':' + String(d.text || ''));
      if (d && d.type === 'van-demo-playing') {
        window.__playing = true;
        state.textContent = '正在播放';
      }
      if (d && d.type === 'van-demo-status') {
        window.__childStatus = d.text + ' paused=' + d.paused + ' t=' + d.t + ' dur=' + d.dur;
      }
      if (d && d.type === 'van-demo-event') {
        (window.__childEvents = window.__childEvents || []).push(d.name);
      }
    });
  })();
</script>
</body>
</html>
