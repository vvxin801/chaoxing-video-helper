<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>模拟“小节页”（里面还有两个视频 iframe）</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #05070b; overflow: hidden; }
  .wrap { display: grid; grid-template-rows: 1fr 1fr; height: 100%; gap: 6px; padding: 6px; }
  .slot { position: relative; min-height: 0; border-radius: 8px; overflow: hidden; background: #000; border: 1px solid #1f2937; }
  .slot iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .lab {
    position: absolute; z-index: 2; left: 8px; top: 8px; padding: 2px 8px; border-radius: 999px;
    background: rgba(0,0,0,.55); color: #cbd5e1; font: 11px/1.5 system-ui, "Microsoft YaHei", sans-serif;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="slot"><span class="lab">任务点 1</span><iframe id="f1" title="任务点 1" allow="autoplay"></iframe></div>
    <div class="slot"><span class="lab">任务点 2</span><iframe id="f2" title="任务点 2" allow="autoplay"></iframe></div>
  </div>
  <script>
  (() => {
    'use strict';
    const params = new URLSearchParams(location.search);
    const lesson = params.get('lesson') || '1';
    const dur = params.get('dur') || '3';
    const f1 = document.getElementById('f1');
    const f2 = document.getElementById('f2');
    // 第 1 个自己播，第 2 个停在“等待播放”，等扩展让它接着播
    f1.src = 'player.html?lesson=' + lesson + '&dur=' + dur + '&autoplay=1';
    f2.src = 'player.html?lesson=' + lesson + '&dur=' + dur + '&autoplay=0';
  })();
  </script>
</body>
</html>
